const TZ={"AL":"Central","AK":"Alaska","AZ":"Arizona","AR":"Central","CA":"Pacific","CO":"Mountain","CT":"Eastern","DE":"Eastern","FL":"Eastern","GA":"Eastern","HI":"Hawaii","ID":"Mountain","IL":"Central","IN":"Eastern","IA":"Central","KS":"Central","KY":"Eastern","LA":"Central","ME":"Eastern","MD":"Eastern","MA":"Eastern","MI":"Eastern","MN":"Central","MS":"Central","MO":"Central","MT":"Mountain","NE":"Central","NV":"Pacific","NH":"Eastern","NJ":"Eastern","NM":"Mountain","NY":"Eastern","NC":"Eastern","ND":"Central","OH":"Eastern","OK":"Central","OR":"Pacific","PA":"Eastern","RI":"Eastern","SC":"Eastern","SD":"Central","TN":"Central","TX":"Central","UT":"Mountain","VT":"Eastern","VA":"Eastern","WA":"Pacific","WV":"Eastern","WI":"Central","WY":"Mountain","DC":"Eastern"};
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function norm(s){return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim()}
function state(a){let m=String(a).match(/,\s*([A-Z]{2})\s+\d{5}/i);return m?m[1].toUpperCase():""}
function tz(a){return TZ[state(a)]||"See exact location"}
function search(){
 const q=document.getElementById("q").value.trim(), n=norm(q), out=document.getElementById("results"), st=document.getElementById("status");
 if(!q){clearSearch();return}
 const zip=(q.match(/\b\d{5}\b/)||[])[0];
 const active=LOCATIONS.filter(x=>String(x.status).toUpperCase()==="ACTIVE");
 const scored=active.map(x=>{
  const name=norm(x.name), addr=norm(x.address), market=norm(x.market), leader=norm(x.leader);
  let score=0;
  if(zip && x.address.includes(zip))score+=120;
  if(name===n)score+=100; else if(name.includes(n)||n.includes(name))score+=70;
  if(market===n)score+=80; else if(market.includes(n)||n.includes(market))score+=55;
  if(addr.includes(n))score+=45;
  if(leader.includes(n))score+=40;
  return {x,score};
 }).filter(z=>z.score>0).sort((a,b)=>b.score-a.score).slice(0,10);
 st.textContent=scored.length?scored.length+" active/bookable result(s).":"No matching active HubSpot location found.";
 out.innerHTML=scored.map((z,i)=>{let x=z.x;return `<div class="card">
 <b>${i+1}. ${esc(x.name)}</b><span class="badge">BOOKABLE</span>
 <div class="meta">${esc(x.address)}</div>
 <div class="meta">Market: <b>${esc(x.market)}</b> · Time Zone: <b>${esc(tz(x.address))}</b></div>
 <div class="meta">Market Leader: <b>${esc(x.leader)}</b>${x.leaderEmail?" · "+esc(x.leaderEmail):""}</div>
 <div class="small">Master working ID: ${esc(x.id)}</div></div>`}).join("");
}
function clearSearch(){document.getElementById("q").value="";document.getElementById("results").innerHTML="";document.getElementById("status").textContent="Ready."}
document.getElementById("q").addEventListener("keydown",e=>{if(e.key==="Enter")search()});
